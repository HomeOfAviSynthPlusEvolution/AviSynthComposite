name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        scalar: ["ON", "OFF"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build/ci -DCP_BUILD_TESTS=ON -DCP_SCALAR_ONLY=${{ matrix.scalar }} -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/ci --config Release --parallel
      - run: ctest --test-dir build/ci -C Release --output-on-failure
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          cmake -S . -B build/sanitize
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCP_SANITIZERS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O1 -g"
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g"
      - run: cmake --build build/sanitize --parallel
      - run: ctest --test-dir build/sanitize --output-on-failure --parallel 2
  windows-x86:
    runs-on: windows-latest
    strategy:
      matrix:
        scalar: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build/x86 -A Win32 -DCP_SCALAR_ONLY=${{ matrix.scalar }}
      - run: cmake --build build/x86 --config Release --parallel
      - run: ctest --test-dir build/x86 -C Release --output-on-failure
